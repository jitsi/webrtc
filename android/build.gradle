plugins {
    id 'com.android.library' version '8.13.2'
    id 'com.vanniktech.maven.publish' version '0.35.0'
}

ext {
    webrtcVersion = '155'
    libraryVersion = '155.0.1'
}

android {
    namespace 'org.jitsi.webrtc'
    compileSdk 34

    defaultConfig {
        minSdk 24
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    // Packaged into the AAR as libs/libwebrtc.jar.
    implementation files('libs/libwebrtc.jar')
}

mavenPublishing {
    // Central Portal is the only Sonatype host since OSSRH was retired (June 2025).
    // CI runs publishAndReleaseToMavenCentral; publishToMavenCentral leaves the deployment for manual release.
    publishToMavenCentral()

    // Credentials and key come in as Gradle properties (ORG_GRADLE_PROJECT_* in CI):
    //   mavenCentralUsername / mavenCentralPassword  - Central Portal user token
    //   signingInMemoryKey / signingInMemoryKeyPassword - armored PGP private key
    // Signing is skipped locally when no key is provided; Central rejects unsigned uploads anyway.
    if (project.hasProperty('signingInMemoryKey')) {
        signAllPublications()
    }

    coordinates('org.jitsi', 'webrtc', libraryVersion)

    configure(new com.vanniktech.maven.publish.AndroidSingleVariantLibrary('release', true, true))

    pom {
        name = 'Jitsi WebRTC build for Android'
        description = "WebRTC M${webrtcVersion} builds for Android"
        url = 'https://github.com/jitsi/webrtc'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0'
            }
            license {
                name = 'The MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }

        developers {
            developer {
                id = 'org.jitsi'
                name = 'Jitsi Team'
                email = 'dev@jitsi.org'
            }
        }

        scm {
            url = 'https://github.com/jitsi/webrtc'
            connection = 'scm:git:https://github.com/jitsi/webrtc.git'
            developerConnection = 'scm:git:ssh://git@github.com/jitsi/webrtc.git'
        }
    }
}
