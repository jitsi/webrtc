name: Release Android

on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: 17

      # Uploads the signed AAR, sources, POM and module file to the Central Portal and releases
      # the deployment automatically (vanniktech maven-publish plugin).
      - name: Publish
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PW }}
          GPG_KEY: ${{ secrets.GPG_KEY }}
        run: |
          # The key secret was historically fed through `echo -e`; %b expands escaped newlines if present.
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(printf '%b' "$GPG_KEY")"
          ./gradlew --no-daemon publishAndReleaseToMavenCentral
